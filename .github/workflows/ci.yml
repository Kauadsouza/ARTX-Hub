name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      # O mesmo comando de quem roda os testes na máquina: ele liga a condição
      # react-server, sem a qual os módulos que só rodam no servidor recusam
      # carregar e os testes das rotas caem antes de começar.
      - run: npm test
      - run: npm run lint
      - run: npm run build
